<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multi Timezone Digital Clock</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#60a5fa;
      --muted:#94a3b8;
      --text:#e6eef8;
      --gap:12px;
      --radius:10px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg),#071022 120%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }
    .container{
      width:100%;
      max-width:920px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      border-radius:14px;
      padding:20px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{margin:0 0 6px 0;font-size:20px}
    .sub{color:var(--muted);font-size:13px;margin:0}
    .tz-form{display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap;margin:14px 0}
    .tz-form label{font-size:13px;color:var(--muted);margin-right:6px}
    #tz-input{
      flex:1 1 260px;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.05);
      background:rgba(255,255,255,0.02);
      color:var(--text);
      min-width:160px;
    }
    #add-btn{
      padding:10px 14px;
      border-radius:8px;
      border:0;
      background:var(--accent);
      color:#05233a;
      font-weight:600;
      cursor:pointer;
    }
    #add-btn[disabled]{opacity:.6;cursor:not-allowed}
    .toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
    .clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .clock{
      background:var(--card);
      padding:12px;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:86px;
      position:relative;
    }
    .zone{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .zone-name{font-weight:700;word-break:break-word}
    .offset{font-size:13px;color:var(--muted)}
    .time{font-feature-settings:"tnum";font-variant-numeric:tabular-nums;font-size:22px}
    .controls{display:flex;gap:8px;align-items:center;justify-content:flex-end}
    .remove-btn{
      background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);
      padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px
    }
    .remove-btn:hover{color:var(--text);border-color:rgba(255,255,255,0.08)}
    .hint{margin-top:12px;color:var(--muted);font-size:13px}
    .empty{color:var(--muted);padding:18px;border-radius:8px;background:rgba(255,255,255,0.01);text-align:center}
    @media (max-width:480px){
      .tz-form{gap:8px}
      .time{font-size:18px}
    }
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <main class="container" role="main">
    <header>
      <div>
        <h1>Multi Timezone Digital Clock</h1>
        <p class="sub">Add IANA time zones, toggle 12/24 hour, times update every second.</p>
      </div>
      <div aria-hidden="true" style="font-size:12px;color:var(--muted)">UTC now: <span id="utc-now">--:--:--</span></div>
    </header>

    <form id="tz-form" class="tz-form" aria-label="Add timezone">
      <label for="tz-input" class="sr-only">Add timezone (IANA name)</label>
      <input id="tz-input" list="tz-list" placeholder="e.g. America/New_York" autocomplete="off" />
      <datalist id="tz-list">
        <!-- Filled by script with common zones or browser-supported list -->
      </datalist>
      <button id="add-btn" type="submit">Add</button>

      <label class="toggle" title="Toggle 24-hour format">
        <input id="format-toggle" type="checkbox" />
        Use 24-hour
      </label>
    </form>

    <section id="clocks" class="clocks" aria-live="polite" aria-atomic="false">
      <!-- Clocks injected here -->
    </section>

    <p class="hint">Tip: Use IANA time zone names (for example "America/Chicago", "Europe/Berlin").</p>
  </main>

  <script>
    // Single-file multi-timezone clock
    (function () {
      const DEFAULT_ZONES = ['UTC', 'America/New_York', 'Europe/London', 'Asia/Tokyo'];
      const STORAGE_KEY = 'multi-tz-clocks-v1';

      const form = document.getElementById('tz-form');
      const tzInput = document.getElementById('tz-input');
      const addBtn = document.getElementById('add-btn');
      const clocksEl = document.getElementById('clocks');
      const formatToggle = document.getElementById('format-toggle');
      const utcNowEl = document.getElementById('utc-now');
      const tzList = document.getElementById('tz-list');

      // Load or default state
      let state = (function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return { zones: DEFAULT_ZONES.slice(), is24Hour: false };
      })();

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      function validTimeZone(tz) {
        if (!tz || typeof tz !== 'string') return false;
        try {
          // If browser supports Intl and the zone is invalid this may throw.
          Intl.DateTimeFormat(undefined, { timeZone: tz }).format();
          return true;
        } catch (e) {
          return false;
        }
      }

      function makeZoneOptions() {
        // Try to populate datalist with full supported values if available, otherwise common list.
        if (Array.isArray(Intl && Intl.supportedValuesOf && Intl.supportedValuesOf('timeZone'))) {
          try {
            const zones = Intl.supportedValuesOf('timeZone');
            // Add a subset to datalist to avoid huge DOM (but keep full list for validation)
            const useful = ['UTC', 'Europe/London', 'Europe/Paris', 'Asia/Tokyo', 'Asia/Hong_Kong',
              'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Australia/Sydney'];
            useful.concat(zones.slice(0, 0)); // noop to show concept
            zones.slice(0, 120).forEach(z => {
              const opt = document.createElement('option'); opt.value = z; tzList.appendChild(opt);
            });
            return;
          } catch (e) {}
        }
        // fallback: a short curated list
        ['UTC','America/New_York','America/Chicago','America/Los_Angeles','Europe/London','Europe/Paris',
         'Asia/Tokyo','Asia/Shanghai','Asia/Hong_Kong','Australia/Sydney'].forEach(z => {
           const opt = document.createElement('option'); opt.value = z; tzList.appendChild(opt);
         });
      }

      function createClockCard(tz) {
        const card = document.createElement('article');
        card.className = 'clock';
        card.dataset.timezone = tz;

        const zoneRow = document.createElement('div');
        zoneRow.className = 'zone';

        const name = document.createElement('div');
        name.className = 'zone-name';
        name.textContent = tz;

        const offset = document.createElement('div');
        offset.className = 'offset';
        offset.textContent = '';

        zoneRow.appendChild(name);
        zoneRow.appendChild(offset);

        const timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.setAttribute('aria-hidden', 'false');
        timeEl.textContent = '';

        const controls = document.createElement('div');
        controls.className = 'controls';
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.type = 'button';
        removeBtn.textContent = 'Remove';
        removeBtn.addEventListener('click', () => {
          state.zones = state.zones.filter(z => z !== tz);
          saveState();
          renderClocks();
        });

        controls.appendChild(removeBtn);

        card.appendChild(zoneRow);
        card.appendChild(timeEl);
        card.appendChild(controls);

        return card;
      }

      function renderClocks() {
        clocksEl.innerHTML = '';
        if (!state.zones || state.zones.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No timezones added. Use the box above to add one.';
          clocksEl.appendChild(empty);
          return;
        }
        state.zones.forEach(tz => {
          const card = createClockCard(tz);
          clocksEl.appendChild(card);
        });
        updateAllTimes(); // immediate
      }

      function formatDateForZone(date, tz) {
        const fmt = new Intl.DateTimeFormat(undefined, {
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: !state.is24Hour,
          timeZone: tz
        });
        const dateFmt = new Intl.DateTimeFormat(undefined, {
          year: 'numeric', month: 'short', day: 'numeric',
          timeZone: tz
        });
        return { timeText: fmt.format(date), dateText: dateFmt.format(date) };
      }

      function computeOffsetString(date, tz) {
        // Compute offset from UTC as ±HH:MM by comparing UTC time and tz time
        try {
          // Get timezone-localized string then parse to Date
          const parts = date.toLocaleString('en-CA', { timeZone: tz });
          // Parsing en-CA 'YYYY-MM-DD HH:MM:SS' is well-supported
          const tzDate = new Date(parts);
          if (isNaN(tzDate)) {
            // fallback heuristic: use formatToParts to reconstruct
            const partsObj = new Intl.DateTimeFormat('en-CA', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
              timeZone: tz
            }).formatToParts(date).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
            if (partsObj.year) {
              const s = `${partsObj.year}-${partsObj.month}-${partsObj.day} ${partsObj.hour}:${partsObj.minute}:${partsObj.second}`;
              const pdate = new Date(s);
              if (!isNaN(pdate)) return offsetFromDates(date, pdate);
            }
            return '';
          }
          return offsetFromDates(date, tzDate);
        } catch (e) { return ''; }
      }

      function offsetFromDates(utcDate, tzDate) {
        // utcDate and tzDate represent the same moment but in different zones;
        // compute tz offset from UTC in hours/minutes
        const utcMs = Date.UTC(utcDate.getUTCFullYear(), utcDate.getUTCMonth(), utcDate.getUTCDate(),
                              utcDate.getUTCHours(), utcDate.getUTCMinutes(), utcDate.getUTCSeconds());
        const diffMin = Math.round((tzDate.getTime() - utcMs) / 60000);
        // diffMin is the offset in minutes east of UTC
        const sign = diffMin >= 0 ? '+' : '-';
        const abs = Math.abs(diffMin);
        const hh = String(Math.floor(abs / 60)).padStart(2, '0');
        const mm = String(abs % 60).padStart(2, '0');
        return `UTC${sign}${hh}:${mm}`;
      }

      function updateAllTimes() {
        const now = new Date();
        // Update UTC display
        utcNowEl.textContent = now.toISOString().slice(11, 19) + ' UTC';

        const cards = clocksEl.querySelectorAll('.clock');
        cards.forEach(card => {
          const tz = card.dataset.timezone;
          const { timeText, dateText } = formatDateForZone(now, tz);
          const timeEl = card.querySelector('.time');
          timeEl.textContent = `${timeText} — ${dateText}`;
          const offsetEl = card.querySelector('.offset');
          offsetEl.textContent = computeOffsetString(now, tz);
        });
      }

      // Ticker
      let tickId = null;
      function startTicker() {
        if (tickId) cancelAnimationFrame(tickId);
        function tick() {
          updateAllTimes();
          tickId = requestAnimationFrame(() => {
            // schedule next update roughly on the next second boundary
            const now = Date.now();
            const untilNextSecond = 1000 - (now % 1000);
            setTimeout(() => requestAnimationFrame(tick), untilNextSecond);
          });
        }
        tick();
      }

      // Form handlers
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const tz = tzInput.value.trim();
        if (!tz) return;
        if (state.zones.includes(tz)) {
          tzInput.value = '';
          tzInput.placeholder = 'Already added';
          return;
        }
        if (!validTimeZone(tz)) {
          tzInput.value = '';
          tzInput.placeholder = 'Invalid IANA timezone';
          return;
        }
        state.zones.push(tz);
        saveState();
        tzInput.value = '';
        renderClocks();
      });

      formatToggle.addEventListener('change', () => {
        state.is24Hour = !!formatToggle.checked;
        saveState();
        updateAllTimes();
      });

      // Initialize
      // Filter invalid zones that may have been persisted
      state.zones = (state.zones || []).filter(tz => typeof tz === 'string' && validTimeZone(tz));
      if (!state.zones || state.zones.length === 0) state.zones = DEFAULT_ZONES.slice();

      makeZoneOptions();
      formatToggle.checked = !!state.is24Hour;
      renderClocks();
      startTicker();

      // Expose a quick keyboard shortcut: Enter in input adds, Escape clears
      tzInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') tzInput.value = '';
      });
    })();
  </script>
</body>
</html>
